<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoto Radio Debug 🔧</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="img/logo-radio.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    main { max-width: 800px; }
    #log { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .probe { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; }
    .probe-head { display: flex; justify-content: space-between; gap: 1rem; font-family: monospace; }
    .probe pre { white-space: pre-wrap; word-break: break-all; margin: 0.5rem 0 0; font-size: 0.8rem; background: var(--border); padding: 0.5rem; border-radius: 4px; }
    .probe-status--ok { color: var(--good); }
    .probe-status--fail { color: var(--bad); }
    button { padding: 0.5rem 1rem; border: 1px solid var(--accent); border-radius: 6px; background: white; color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Yoto Radio Debug 🔧</h1>
    <p class="subtitle">Not part of the app — probes several endpoints/scopes to see what your token can actually access.</p>
  </header>

  <main>
    <p><a href="index.html">← Back to the app</a></p>
    <p id="account-status"></p>
    <button id="run-button" type="button">Run all probes</button>
    <div id="log"></div>
  </main>

  <script type="module" src="js/debug.js"></script>
</body>
</html>
